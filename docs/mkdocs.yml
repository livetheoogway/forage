    - Indexable Documents: core-concepts/indexable-documents.md
    - Field Types: core-concepts/field-types.md
    - Data Store: core-concepts/data-store.md
    - Bootstrapping: core-concepts/bootstrapping.md
  - Query Types:
    - Query Types: queries/index.md
    - Match Query: queries/match-query.md
    - Boolean Query: queries/boolean-query.md
    - Range Query: queries/range-query.md
    - Fuzzy Query: queries/fuzzy-query.md
    - Phrase Query: queries/phrase-query.md
    - Prefix Query: queries/prefix-query.md
    - Match All Query: queries/match-all-query.md
  - Scoring & Ranking:
    - Scoring & Ranking: scoring/index.md
    - Query Boosts: scoring/query-boosts.md
    - Function Score: scoring/function-score.md
    - Sorting: scoring/sorting.md
