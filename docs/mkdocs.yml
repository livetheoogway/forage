site_name: Forage
site_url: https://livetheoogway.github.io/forage
repo_url: https://github.com/livetheoogway/forage
site_description: In-memory Search made Easy - A library that helps you build an in-memory search index using Lucene

theme:
  logo: assets/logo-white.png
  favicon: assets/logo-white.png
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - content.code.copy
    - content.code.annotate
    - navigation.expand
    - toc.follow
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
  font:
    text: Open Sans  # Options: Inter, Nunito, Poppins, Source Sans Pro, Lato, Open Sans
    code: JetBrains Mono  # Options: JetBrains Mono, Fira Code, Source Code Pro

  palette:
    - scheme: forage
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: forage-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/livetheoogway/forage
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/tushar-naik
    - icon: custom/live-the-oogway
      link: https://livetheoogway.com/

plugins:
  - search

copyright: "Copyright &copy; 2022-2026 Live the Oogway, Tushar Naik"

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

